name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    concurrency:   # a newer push supersedes an older run, so "latest" never goes backwards
      group: apk-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write   # to publish the "latest" release with the APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Shader + analyzer checks
        run: |
          sudo apt-get install -y -qq glslang-tools > /dev/null
          android/tools/check.sh
          node web/tools/looks-check.js
          node web/tools/adaptive-check.js

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.TAV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tav.keystore"
            echo "TAV_KEYSTORE=$RUNNER_TEMP/tav.keystore" >> "$GITHUB_ENV"
            echo "KEY_NOTE=Signed with the repository's release key, so it installs over earlier releases." >> "$GITHUB_ENV"
          else
            echo "::warning::No TAV_KEYSTORE_B64 secret: signing with a one-off key (see README, Signing)."
            echo "KEY_NOTE=Signed with a one-off key: uninstall an older TAV before installing this one. Add the TAV_KEYSTORE_B64 and TAV_KS_PASS secrets (README, Signing) to make updates seamless." >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          TAV_KS_PASS: ${{ secrets.TAV_KS_PASS || 'android' }}
        run: android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TAV-apk
          path: android/build/TAV.apk

      - name: Publish as the "latest" release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android/build/TAV.apk \
            --target "$GITHUB_SHA" --latest --title "TAV — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`. Download **TAV.apk** on your phone and open it to install (allow installs from your browser/file manager when asked). ${KEY_NOTE}"

  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tav (gcc and clang)
        working-directory: termux
        run: |
          make CC=gcc CFLAGS="-O2 -Wall -Wextra -Werror"
          ./tav --help > /dev/null
          make clean
          make CC=clang CFLAGS="-O2 -Wall -Wextra -Werror"
          ./tav --help > /dev/null

  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schema + scenario test
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: cloud/tools/check.sh
