name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the "latest" release with the APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Shader + analyzer checks
        run: |
          sudo apt-get install -y -qq glslang-tools > /dev/null
          android/tools/check.sh

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TAV-apk
          path: android/build/TAV.apk

      - name: Publish as the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android/build/TAV.apk \
            --target "$GITHUB_SHA" --latest --title "TAV — latest build" \
            --notes "Built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`. Download **TAV.apk** on your phone and open it to install (allow installs from your browser/file manager when asked)."

  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tav (gcc and clang)
        working-directory: termux
        run: |
          make CC=gcc CFLAGS="-O2 -Wall -Wextra -Werror" && ./tav --help > /dev/null && make clean
          make CC=clang CFLAGS="-O2 -Wall -Wextra -Werror" && ./tav --help > /dev/null
